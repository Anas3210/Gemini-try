<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Invitation for Sweety ❤️</title>
    
    <!-- Google Fonts for Romantic Styling -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;500&family=Great+Vibes&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Background Music -->
    <!-- Note: Paste a romantic mp3 file link in the src below or keep a local music.mp3 file -->
    <audio id="bg-music" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <div class="wrapper">
        <div class="envelope-wrapper" id="envelope">
            <!-- Envelope Flap & Body -->
            <div class="lid one"></div>
            <div class="lid two"></div>
            <div class="envelope-body"></div>
            
            <!-- Open Button on Envelope -->
            <button class="open-btn" id="openBtn">Open Envelope ✨</button>

            <!-- Floating Hearts Inside Envelope -->
            <div class="card">
                <div class="card-content">
                    <h1 class="title">Invitation</h1>
                    <p class="subtitle">For an upcoming date ❤️</p>
                    
                    <div class="details">
                        <p><strong>From:</strong> Mehedi Hasan Tusar</p>
                        <p><strong>To:</strong> Sweety</p>
                        <p class="highlight"><strong>Date:</strong> 13-08-2026</p>
                        <p class="highlight"><strong>Time:</strong> 3:00 PM</p>
                        <p><strong>Location:</strong> Lapino</p>
                    </div>

                    <div class="footer-note">
                        Can't wait to see you! 💕
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
