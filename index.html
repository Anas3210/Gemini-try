<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Invitation For Sweety</title>
    <!-- Google Fonts for Stylish Writing -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Linking External CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main Envelope Unit -->
    <div class="envelope-wrapper" id="envelope">
        <div class="open-btn">OPEN</div>
        <div class="envelope-pocket"></div>
        
        <!-- Inside Card -->
        <div class="card">
            <div>
                <h1>Invitation</h1>
                <h3>For upcoming date</h3>
            </div>
            
            <div class="details">
                <p><span>From:</span> Mehedi Hasan Tusar</p>
                <p><span>To:</span> Sweety</p>
                <p><span>Date:</span> 13-08-2026</p>
                <p><span>Time:</span> 3:00 pm</p>
                <p><span>Location:</span> Lapino</p>
            </div>

            <p class="closing-text">
                Waiting for you... ❤️
            </p>
        </div>
    </div>

    <!-- Soft Instrumental Music -->
    <audio id="bg-music" loop src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>
    <button class="music-btn" onclick="toggleMusic()">🎵 Toggle Music</button>

    <!-- Linking External JavaScript -->
    <script src="script.js"></script>
</body>
</html>
